<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PMO Central Repository — Prototype</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b1530;
    --panel:#101d40;
    --panel-2:#152450;
    --line:#22315f;
    --text:#e7ecfb;
    --text-dim:#8b97c2;
    --blue:#3b82f6;
    --blue-soft:#1d3a7a;
    --emerald:#22c58b;
    --amber:#f2a93c;
    --rose:#f0596a;
    --violet:#a78bfa;
    --slate:#5b6899;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background-color:var(--bg);
    color:var(--text);
    font-family:'IBM Plex Sans', sans-serif;
    font-size:14px;
    -webkit-font-smoothing:antialiased;
  }
  .app{display:flex; min-height:100vh;}

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:236px; flex-shrink:0;
    background:#081127;
    border-right:1px solid var(--line);
    display:flex; flex-direction:column;
    padding:22px 16px;
    position:sticky; top:0; height:100vh;
  }
  .brand{display:flex; align-items:center; gap:10px; padding:0 6px 22px 6px; border-bottom:1px solid var(--line); margin-bottom:18px;}
  .brand-mark{
    width:34px; height:34px; border-radius:9px;
    background:linear-gradient(135deg, var(--blue), #7c5cff);
    display:flex; align-items:center; justify-content:center;
    font-family:'Space Grotesk',sans-serif; font-weight:700; color:#fff; font-size:15px;
  }
  .brand-text .t1{font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:14px; line-height:1.2;}
  .brand-text .t2{font-size:11px; color:var(--text-dim);}
  .nav{display:flex; flex-direction:column; gap:2px; margin-top:4px;}
  .nav-item{
    display:flex; align-items:center; gap:10px;
    padding:9px 10px; border-radius:8px; cursor:pointer;
    color:var(--text-dim); font-size:13.5px; font-weight:500;
    border:1px solid transparent;
    transition:background .15s, color .15s;
  }
  .nav-item:hover{background:var(--panel); color:var(--text);}
  .nav-item.active{background:var(--blue-soft); color:#cfe0ff; border-color:#2a4a99;}
  .nav-icon{width:16px; text-align:center; opacity:.9;}
  .sidebar-footer{margin-top:auto; padding-top:14px; border-top:1px solid var(--line);}
  .ghost-btn{
    width:100%; padding:8px 10px; border-radius:8px; border:1px solid var(--line);
    background:transparent; color:var(--text-dim); font-size:12px; cursor:pointer;
    font-family:'IBM Plex Sans',sans-serif;
  }
  .ghost-btn:hover{color:var(--text); border-color:var(--slate);}
  .scope-note{font-size:11px; color:var(--text-dim); margin-top:10px; line-height:1.5;}

  /* ---------- Main ---------- */
  .main{flex:1; padding:26px 34px 60px 34px; max-width:1220px;}
  .page-head{display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:22px;}
  .page-head h1{font-family:'Space Grotesk',sans-serif; font-size:22px; margin:0 0 4px 0; font-weight:600;}
  .page-head p{margin:0; color:var(--text-dim); font-size:13px;}
  .pill{
    font-size:11px; padding:4px 10px; border-radius:100px;
    background:var(--panel-2); border:1px solid var(--line); color:var(--text-dim);
    font-family:'IBM Plex Mono', monospace;
  }

  .panel{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:18px;}
  .grid{display:grid; gap:14px;}
  .kpi-grid{grid-template-columns:repeat(5,1fr); margin-bottom:12px;}
  @media(max-width:1050px){.kpi-grid{grid-template-columns:repeat(3,1fr);}}
  .kpi{padding:16px 16px 14px 16px;}
  .kpi .label{font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.04em;}
  .kpi .value{font-family:'Space Grotesk',sans-serif; font-size:24px; font-weight:600; margin-top:6px;}
  .kpi .sub{font-size:11px; color:var(--text-dim); margin-top:4px;}
  .kpi.accent-blue .value{color:#7cabff;}
  .kpi.accent-emerald .value{color:var(--emerald);}
  .kpi.accent-amber .value{color:var(--amber);}
  .kpi.accent-rose .value{color:var(--rose);}
  .kpi.accent-violet .value{color:var(--violet);}

  .section-title{font-family:'Space Grotesk',sans-serif; font-size:14.5px; font-weight:600; margin:26px 0 10px 0; display:flex; align-items:center; gap:8px;}
  .section-title.tight{margin-top:16px;}
  .section-title .count{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--text-dim); font-weight:400;}

  table{width:100%; border-collapse:collapse;}
  th{
    text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.05em;
    color:var(--text-dim); font-weight:500; padding:9px 10px; border-bottom:1px solid var(--line);
  }
  td{padding:11px 10px; border-bottom:1px solid #182552; font-size:13px; vertical-align:middle;}
  tr.row:hover td{background:#0d1938;}
  tr.row{cursor:pointer;}
  tbody tr:last-child td{border-bottom:none;}

  .badge{display:inline-flex; align-items:center; gap:5px; font-size:11px; padding:3px 9px; border-radius:100px; font-weight:500; white-space:nowrap;}
  .badge::before{content:''; width:6px; height:6px; border-radius:50%; background:currentColor;}
  .badge.Active{background:#0f2f2a; color:var(--emerald);}
  .badge.Delayed{background:#3a2a10; color:var(--amber);}
  .badge.Completed{background:#132a4a; color:#7cabff;}
  .badge.Terminated{background:#3a1720; color:var(--rose);}

  .proj-id{font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--text-dim);}

  /* month strip - signature element */
  .month-strip{display:flex; gap:3px; align-items:center;}
  .m-dot{width:9px; height:16px; border-radius:2px; background:#1c2a56;}
  .m-dot.ok{background:var(--emerald);}
  .m-dot.warn{background:var(--amber);}
  .m-dot.bad{background:var(--rose);}
  .m-dot.empty{background:#1c2a56; opacity:.5;}

  .detail-row td{background:#0a1531; padding:0; border-bottom:1px solid var(--line);}
  .detail-inner{padding:18px 22px 22px 22px;}
  .detail-top{display:grid; grid-template-columns:1.3fr 1fr; gap:22px; margin-bottom:18px;}
  @media(max-width:900px){.detail-top{grid-template-columns:1fr;}}
  .detail-inner h4{font-size:11.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-dim); margin:0 0 10px 0; font-weight:600;}
  .mini-table{width:100%; font-size:12px; border-collapse:collapse;}
  .mini-table th{font-size:10px; padding:6px 8px;}
  .mini-table td{padding:7px 8px; font-size:12px;}
  .field-list{display:grid; grid-template-columns:1fr 1fr; gap:8px 16px; font-size:12.5px;}
  .field-list .f-label{color:var(--text-dim); font-size:10.5px; text-transform:uppercase; letter-spacing:.03em;}
  .field-list .f-value{margin-top:2px;}
  .lesson-box{margin-top:12px; padding:10px 12px; background:#0f1c40; border:1px solid var(--blue-soft); border-radius:8px; font-size:12.5px; line-height:1.5;}
  .lesson-box .tag{font-size:10px; color:#7cabff; text-transform:uppercase; letter-spacing:.04em; margin-bottom:5px; font-weight:600;}

  .sub-tables{display:grid; grid-template-columns:1fr 1fr 1fr; gap:16px;}
  @media(max-width:900px){.sub-tables{grid-template-columns:1fr;}}
  .sub-table-box{background:#0d1938; border:1px solid var(--line); border-radius:8px; padding:12px;}
  .sub-table-box h5{margin:0 0 8px 0; font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-dim); font-weight:600; display:flex; justify-content:space-between; align-items:center;}
  .chip-list{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; min-height:20px;}
  .chip{background:#152450; border:1px solid var(--line); border-radius:100px; padding:4px 10px; font-size:11.5px; display:flex; align-items:center; gap:6px;}
  .chip .role{color:var(--text-dim); font-size:10.5px;}
  .chip button{background:none; border:none; color:var(--text-dim); cursor:pointer; font-size:12px; padding:0; line-height:1;}
  .chip button:hover{color:var(--rose);}
  .mini-add{display:flex; gap:6px;}
  .mini-add input, .mini-add select{flex:1; padding:6px 8px; font-size:12px;}
  .mini-add button{padding:6px 10px; font-size:12px;}

  /* Forms */
  .form-grid{display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px 16px;}
  @media(max-width:900px){.form-grid{grid-template-columns:1fr 1fr;}}
  .field{display:flex; flex-direction:column; gap:6px;}
  .field.full{grid-column:1 / -1;}
  label{font-size:11.5px; color:var(--text-dim); font-weight:500;}
  label .ar{color:#5b6899; font-weight:400;}
  input, select, textarea{
    background:#0a1531; border:1px solid var(--line); border-radius:7px; color:var(--text);
    padding:9px 10px; font-size:13px; font-family:'IBM Plex Sans',sans-serif;
  }
  input:disabled, select:disabled{opacity:.5; cursor:not-allowed;}
  input:focus, select:focus, textarea:focus{outline:none; border-color:var(--blue);}
  textarea{resize:vertical; min-height:60px;}
  .btn{
    background:var(--blue); color:#fff; border:none; padding:10px 18px; border-radius:8px;
    font-size:13px; font-weight:600; cursor:pointer; font-family:'IBM Plex Sans',sans-serif;
  }
  .btn:hover{background:#4f8dff;}
  .btn:disabled{background:var(--slate); cursor:not-allowed;}
  .btn.secondary{background:transparent; border:1px solid var(--line); color:var(--text-dim);}
  .btn.secondary:hover{color:var(--text); border-color:var(--slate);}
  .btn.small{padding:6px 12px; font-size:12px;}
  .form-actions{display:flex; gap:10px; margin-top:6px; grid-column:1/-1; align-items:center;}
  .hint{font-size:11.5px; color:var(--text-dim); margin-top:-4px; margin-bottom:14px; line-height:1.5;}
  .toast{
    position:fixed; bottom:24px; right:24px; background:#0f2f2a; border:1px solid var(--emerald);
    color:#c9f5e3; padding:12px 16px; border-radius:8px; font-size:13px; display:none; box-shadow:0 8px 24px rgba(0,0,0,.4);
    max-width:340px; z-index:50;
  }
  .toast.warn{background:#3a2a10; border-color:var(--amber); color:#ffe6ba;}

  .search-bar{display:flex; gap:10px; margin-bottom:16px;}
  .search-bar input{flex:1;}

  .empty-state{padding:40px 20px; text-align:center; color:var(--text-dim); font-size:13px;}
  .locked-note{display:flex; gap:8px; align-items:flex-start; background:#0f1c40; border:1px solid var(--blue-soft); border-radius:8px; padding:10px 12px; font-size:12px; color:#a9bdec; margin-bottom:16px; line-height:1.5;}
  .warn-note{background:#3a1720; border-color:#7a2a3a; color:#ffc2cd;}
  .conditional{display:none;}
  .conditional.show{display:block;}
  .conditional.show.grid-block{display:grid;}

  .id-check-row{display:flex; gap:10px; align-items:flex-end; margin-bottom:16px;}
  .id-check-row .field{flex:1; max-width:260px;}
  .id-status{font-size:12px; padding:8px 12px; border-radius:8px; display:none;}
  .id-status.new{display:block; background:#0f1c40; border:1px solid var(--blue-soft); color:#a9bdec;}
  .id-status.existing{display:block; background:#0f2f2a; border:1px solid #1f5c48; color:#a9e8cf;}
  .id-status.closed{display:block; background:#3a1720; border:1px solid #7a2a3a; color:#ffc2cd;}

  fieldset{border:1px solid var(--line); border-radius:8px; padding:14px 16px 16px 16px; margin:0 0 16px 0;}
  legend{font-size:11.5px; text-transform:uppercase; letter-spacing:.04em; color:#7cabff; font-weight:600; padding:0 6px;}

  /* Data model / ERD */
  .erd-wrap{display:grid; grid-template-columns:repeat(3,1fr); gap:16px;}
  @media(max-width:1000px){.erd-wrap{grid-template-columns:1fr 1fr;}}
  .erd-table{background:#0d1938; border:1px solid var(--line); border-radius:8px; overflow:hidden;}
  .erd-table.master{border-color:#2a4a99;}
  .erd-head{padding:10px 12px; background:var(--panel-2); font-family:'IBM Plex Mono',monospace; font-size:12px; font-weight:600; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center;}
  .erd-head .n{color:var(--text-dim); font-weight:400; font-size:10.5px;}
  .erd-body{padding:8px 0;}
  .erd-field{padding:5px 12px; font-size:11.5px; font-family:'IBM Plex Mono',monospace; display:flex; justify-content:space-between; color:var(--text-dim);}
  .erd-field.pk{color:#7cabff; font-weight:600;}
  .erd-field.fk{color:var(--amber);}
  .erd-field .k{font-size:9px; opacity:.8;}
  .erd-note{font-size:11.5px; color:var(--text-dim); padding:10px 12px; border-top:1px solid var(--line); line-height:1.5;}
</style>
</head>
<body>
<div class="app">

  <div class="sidebar">
    <div class="brand">
      <div class="brand-mark">PM</div>
      <div class="brand-text">
        <div class="t1">Central Repository</div>
        <div class="t2">PMO access only</div>
      </div>
    </div>
    <div class="nav">
      <div class="nav-item active" data-tab="overview"><span class="nav-icon">◱</span> Overview</div>
      <div class="nav-item" data-tab="master"><span class="nav-icon">☰</span> Project Master</div>
      <div class="nav-item" data-tab="submit"><span class="nav-icon">＋</span> Monthly Submission</div>
      <div class="nav-item" data-tab="lessons"><span class="nav-icon">◈</span> Lessons Learned</div>
      <div class="nav-item" data-tab="model"><span class="nav-icon">▤</span> Data Model</div>
    </div>
    <div class="sidebar-footer">
      <button class="ghost-btn" id="resetBtn">Reset demo data</button>
      <div class="scope-note">Prototype scope: PMO viewers only. Department submission, auth, and Power BI refresh are simulated for this walkthrough.</div>
    </div>
  </div>

  <div class="main" id="main"></div>
</div>

<div class="toast" id="toast"></div>

<script>

     internal_stakeholders    (junction: project_id -> internal dept/sector)
     external_stakeholders    (junction: project_id -> external entity)
     team_members             (junction: project_id -> person, role)
     lessons_learned          (only for Completed / Terminated projects — FK project_id)
   =================================================================== */

async function loadData(){

  }catch(e){ /* no saved data yet — use seed */ }

}

/* ===================== HELPERS ===================== */
function fmtMoney(n){ return "EGP " + Number(n||0).toLocaleString(); }
function fmtMonth(m){
  if(!m) return "—";
  const [y,mo] = m.split("-");
  const names = ["","Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return names[parseInt(mo,10)] + " " + y;
}
function monthlyFor(pid){ return DATA.monthly.filter(m=>m.project===pid).sort((a,b)=>a.month.localeCompare(b.month)); }
function internalFor(pid){ return DATA.internal.filter(x=>x.project===pid); }
function externalFor(pid){ return DATA.external.filter(x=>x.project===pid); }
function teamFor(pid){ return DATA.team.filter(x=>x.project===pid); }
function lessonsFor(pid){ return DATA.lessons.filter(l=>l.project===pid); }
function latestUpdate(pid){ const arr = monthlyFor(pid); return arr.length ? arr[arr.length-1] : null; }
function isClosed(status){ return status==="Completed" || status==="Terminated"; }
function healthClass(u){
  if(!u) return "empty";
  if(u.status==="Terminated") return "bad";
  if(u.status==="Delayed" || u.spi < 0.9) return "warn";
  return "ok";
}
function showToast(msg, warn){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast' + (warn ? ' warn' : '');
  t.style.display = 'block';
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(()=>{ t.style.display='none'; }, 3200);
}

/* ===================== RENDER: TABS ===================== */
function setTab(tab){
  currentTab = tab;
  render();
}
function render(){
  document.querySelectorAll('.nav-item').forEach(el=>{
    el.classList.toggle('active', el.dataset.tab === currentTab);
  });
  renderMain();
}
function renderMain(){
  const main = document.getElementById('main');
  if(currentTab === "overview") main.innerHTML = viewOverview();
  else if(currentTab === "master") main.innerHTML = viewMaster();
  else if(currentTab === "submit") main.innerHTML = viewSubmit();
  else if(currentTab === "lessons") main.innerHTML = viewLessons();
  else if(currentTab === "model") main.innerHTML = viewModel();
  attachHandlers();
}

/* ===================== OVERVIEW (totals first) ===================== */
function viewOverview(){
  const p = DATA.projects;
  const total = p.length;
  const active = p.filter(x=>x.status_cache==="Active" || x.status==="Active").length; // fallback, recomputed below
  const statusOf = (proj)=>{ const u = latestUpdate(proj.id); return u ? u.status : "Active"; };
  const counts = {Active:0, Delayed:0, Completed:0, Terminated:0};
  p.forEach(proj=>{ counts[statusOf(proj)] = (counts[statusOf(proj)]||0) + 1; });

  const openPortfolio = p.filter(x=> !isClosed(statusOf(x)));
  const totalBudget = p.reduce((s,x)=> s + Number(x.totalCost||0), 0);
  const totalDisbursed = p.reduce((s,x)=>{ const u=latestUpdate(x.id); return s + (u?Number(u.disbursed||0):0); },0);
  const avgSpi = openPortfolio.length ? (openPortfolio.reduce((s,x)=>{const u=latestUpdate(x.id); return s+(u?u.spi:1);},0)/openPortfolio.length) : 0;
  const avgCpi = openPortfolio.length ? (openPortfolio.reduce((s,x)=>{const u=latestUpdate(x.id); return s+(u?u.cpi:1);},0)/openPortfolio.length) : 0;

  // sector totals
  const sectorMap = {};
  p.forEach(proj=>{
    if(!sectorMap[proj.sector]) sectorMap[proj.sector] = {count:0, budget:0, disbursed:0};
    sectorMap[proj.sector].count += 1;
    sectorMap[proj.sector].budget += Number(proj.totalCost||0);
    const u = latestUpdate(proj.id);
    sectorMap[proj.sector].disbursed += u ? Number(u.disbursed||0) : 0;
  });
  const sectorRows = Object.entries(sectorMap).sort((a,b)=>b[1].budget-a[1].budget).map(([sector,v])=>`
    <tr>
      <td>${sector}</td>
      <td>${v.count}</td>
      <td>${fmtMoney(v.budget)}</td>
      <td>${fmtMoney(v.disbursed)}</td>
      <td>${v.budget ? Math.round(v.disbursed/v.budget*100) : 0}%</td>
    </tr>`).join("");

  const rows = p.map(proj=>{
    const hist = monthlyFor(proj.id);
    const u = latestUpdate(proj.id);
    const strip = monthStripHTML(hist);
    return `<tr>
      <td><span class="proj-id">${proj.id}</span> &nbsp; ${proj.name}</td>
      <td><span class="badge ${u?u.status:'Active'}">${u?u.status:'Active'}</span></td>
      <td>${u ? u.completion+"%" : "—"}</td>
      <td>${strip}</td>
    </tr>`;
  }).join("");

  return `
    <div class="page-head">
      <div>
        <h1>Portfolio Overview</h1>
        <p>Every figure below is computed live from Project Master + Monthly Updates — nothing here is manually totaled.</p>
      </div>
      <span class="pill">${total} projects tracked</span>
    </div>

    <div class="grid kpi-grid">
      <div class="panel kpi"><div class="label">Total Projects</div><div class="value">${total}</div><div class="sub">across ${Object.keys(sectorMap).length} sectors</div></div>
      <div class="panel kpi accent-blue"><div class="label">Active</div><div class="value">${counts.Active}</div><div class="sub">on submission cadence</div></div>
      <div class="panel kpi accent-amber"><div class="label">Delayed</div><div class="value">${counts.Delayed}</div><div class="sub">SPI below plan</div></div>
      <div class="panel kpi accent-emerald"><div class="label">Completed</div><div class="value">${counts.Completed}</div><div class="sub">closed, archived</div></div>
      <div class="panel kpi accent-rose"><div class="label">Terminated</div><div class="value">${counts.Terminated}</div><div class="sub">closed early</div></div>
    </div>
    <div class="grid kpi-grid">

function monthStripHTML(hist){
  const slots = hist.slice(-6);
  const padding = 6 - slots.length;
  let html = "";
  for(let i=0;i<padding;i++) html += `<div class="m-dot empty" title="no record"></div>`;
  slots.forEach(u=>{
    html += `<div class="m-dot ${healthClass(u)}" title="${fmtMonth(u.month)} — ${u.status}, ${u.completion}% complete, SPI ${u.spi}"></div>`;
  });
  return `<div class="month-strip">${html}</div>`;
}

/* ===================== HANDLERS ===================== */
function attachHandlers(){
  // project row expand
  document.querySelectorAll('tr.row[data-pid]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const pid = el.dataset.pid;
      expandedProject = expandedProject === pid ? null : pid;
      renderMain();
    });
  });

  // junction table add / remove (inside Project Master detail)
  document.querySelectorAll('button[data-add]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const kind = btn.dataset.add;
      const pid = btn.dataset.pid;
      if(kind === "internal"){
        const sel = document.querySelector(`select[data-new-internal-dept="${pid}"]`);
        DATA.internal.push({project: pid, dept: sel.value});
      } else if(kind === "external"){
        const inp = document.querySelector(`input[data-new-external-entity="${pid}"]`);
        if(!inp.value.trim()) return;
        DATA.external.push({project: pid, entity: inp.value.trim()});
      } else if(kind === "team"){
        const nameInp = document.querySelector(`input[data-new-team-name="${pid}"]`);
        const roleInp = document.querySelector(`input[data-new-team-role="${pid}"]`);
        if(!nameInp.value.trim()) return;
        DATA.team.push({project: pid, member: nameInp.value.trim(), role: roleInp.value.trim() || "Team Member"});
      }
      await saveData();
      renderMain();
    });
  });
  document.querySelectorAll('button[data-remove]').forEach(btn=>{
    btn.addEventListener('click', async (e)=>{
      e.stopPropagation();
      const kind = btn.dataset.remove;
      const idx = Number(btn.dataset.idx);
      if(kind==="internal") DATA.internal.splice(idx,1);
      if(kind==="external") DATA.external.splice(idx,1);
      if(kind==="team") DATA.team.splice(idx,1);
      await saveData();
      renderMain();
    });
  });

  // Monthly submission: ID check flow
  const idCheckBtn = document.getElementById('idCheckBtn');
  const idInput = document.getElementById('idCheck');
  if(idCheckBtn){
    const runCheck = ()=>{
      const id = idInput.value.trim();
      const statusBox = document.getElementById('idStatus');
      const form = document.getElementById('submitForm');
      const identFieldset = document.getElementById('identFieldset');
      if(!id){ statusBox.innerHTML=""; form.style.display='none'; return; }

      const existing = DATA.projects.find(p=>p.id.toLowerCase()===id.toLowerCase());
      if(existing){
        const u = latestUpdate(existing.id);
        const status = u ? u.status : "Active";
        if(isClosed(status)){
          statusBox.innerHTML = `<div class="id-status closed">${existing.id} — ${existing.name} is <strong>${status}</strong>. Closed projects no longer accept monthly updates; add a lesson learned from the Project Master detail view instead.</div>`;
          form.style.display = 'none';
          return;
        }
        statusBox.innerHTML = `<div class="id-status existing">${existing.id} recognized — <strong>${existing.name}</strong> (${existing.sector}). This submission will be appended as a new monthly_updates row.</div>`;
        form.style.display = 'block';
        form.dataset.mode = 'update';
        form.dataset.pid = existing.id;
        // prefill + lock identification fields
        document.getElementById('i_sector').value = existing.sector;
        document.getElementById('i_governorAssistant').value = existing.governorAssistant;
        document.getElementById('i_program').value = existing.program;
        document.getElementById('i_name').value = existing.name;
        document.getElementById('i_manager').value = existing.manager;
        document.getElementById('i_type').value = existing.type;
        document.getElementById('i_affiliation').value = existing.affiliation;
        document.getElementById('i_start').value = existing.start;
        document.getElementById('i_origEnd').value = existing.origEnd;
        document.getElementById('i_origDuration').value = existing.origDuration;
        document.getElementById('i_totalCost').value = existing.totalCost;
        document.getElementById('i_currency').value = existing.currency;
        document.getElementById('i_fundingSource').value = existing.fundingSource;
        document.getElementById('i_objective').value = existing.objective;
        document.getElementById('i_description').value = existing.description;
        identFieldset.querySelectorAll('input, select, textarea').forEach(el=> el.disabled = true);
      } else {
        statusBox.innerHTML = `<div class="id-status new">"${id}" not found in Project Master — treated as a <strong>new project</strong>. Fill in the identification fields below; it will be added to the master on submit.</div>`;
        form.style.display = 'block';
        form.dataset.mode = 'create';
        form.dataset.pid = id;
        identFieldset.querySelectorAll('input, select, textarea').forEach(el=>{ el.disabled = false; if(el.tagName!=='SELECT') el.value=''; });
        document.getElementById('i_currency').value = 'EGP';
      }
    };
    idCheckBtn.addEventListener('click', runCheck);
    idInput.addEventListener('keydown', (e)=>{ if(e.key==='Enter'){ e.preventDefault(); runCheck(); } });
  }

  const statusSelect = document.getElementById('u_status');
  const lessonWrap = document.getElementById('lessonWrap');
  if(statusSelect){
    const sync = ()=>{
      const closing = statusSelect.value === "Completed" || statusSelect.value === "Terminated";
      lessonWrap.classList.toggle('show', closing);
    };
    statusSelect.addEventListener('change', sync);
    sync();
  }

  const submitForm = document.getElementById('submitForm');
  if(submitForm){
    submitForm.addEventListener('submit', async (e)=>{
      e.preventDefault();
      const mode = submitForm.dataset.mode;
      const pid = submitForm.dataset.pid;
      const status = document.getElementById('u_status').value;
      const closing = status === "Completed" || status === "Terminated";
      if(closing && !document.getElementById('u_lesson').value.trim()){
        showToast("Add a lesson learned before closing this project.", true);
        return;
      }

      if(mode === 'create'){
        DATA.projects.push({
          id: pid, serial: DATA.projects.length+1,
          sector: document.getElementById('i_sector').value,
          governorAssistant: document.getElementById('i_governorAssistant').value,
          program: document.getElementById('i_program').value,
          name: document.getElementById('i_name').value || pid,
          manager: document.getElementById('i_manager').value,
          description: document.getElementById('i_description').value,
          type: document.getElementById('i_type').value,
          affiliation: document.getElementById('i_affiliation').value,
          start: document.getElementById('i_start').value,
          origEnd: document.getElementById('i_origEnd').value,
          origDuration: Number(document.getElementById('i_origDuration').value)||0,
          objective: document.getElementById('i_objective').value,
          currency: document.getElementById('i_currency').value || 'EGP',
          totalCost: Number(document.getElementById('i_totalCost').value)||0,
          fundingSource: document.getElementById('i_fundingSource').value,
        });
      }

      const month = document.getElementById('u_month').value;
      const record = {
        project: pid, month: month, status: status,
        revisedEnd: document.getElementById('u_revisedEnd').value,
        delayMonths: Number(document.getElementById('u_delayMonths').value)||0,
        totalDuration: Number(document.getElementById('u_totalDuration').value)||0,
        techAdoption: document.getElementById('u_techAdoption').value,
        numStakeholders: Number(document.getElementById('u_numStakeholders').value)||0,
        complexity: document.getElementById('u_complexity').value,
        complexityIndicator: {"Low":1,"Medium":2,"High":3}[document.getElementById('u_complexity').value]||1,
        scheduleChanges: Number(document.getElementById('u_scheduleChanges').value)||0,
        delayType: document.getElementById('u_delayType').value,
        delayReason: document.getElementById('u_delayReason').value,
        delayExplain: document.getElementById('u_delayExplain').value,
        spi: Number(document.getElementById('u_spi').value)||0,
        cpi: Number(document.getElementById('u_cpi').value)||0,
        ev: Number(document.getElementById('u_ev').value)||0,
        eac: Number(document.getElementById('u_eac').value)||0,
        forecast: document.getElementById('u_forecast').value,
        completion: Number(document.getElementById('u_completion').value)||0,
        disbursed: Number(document.getElementById('u_disbursed').value)||0,
        remaining: Number(document.getElementById('u_remaining').value)||0,
        pctDisbursed: Number(document.getElementById('u_pctDisbursed').value)||0,
        fundingComment: document.getElementById('u_fundingComment').value,
        comment: document.getElementById('u_comment').value,
      };
      // never overwrite: remove only an exact same project+month duplicate, else append
      DATA.monthly = DATA.monthly.filter(m => !(m.project===pid && m.month===month));
      DATA.monthly.push(record);

      if(closing){
        DATA.lessons.push({project:pid, category: status==="Completed" ? "Closure Review" : "Early Termination", text: document.getElementById('u_lesson').value.trim(), date: month+"-28"});
      }

      await saveData();
      showToast(mode==='create' ? `${pid} added to Project Master and its first monthly record was inserted.` : `Monthly record inserted for ${pid} — ${fmtMonth(month)}.`);
      expandedProject = pid;
      setTab('master');
    });
  }

  const lessonSearch = document.getElementById('lessonSearch');
  if(lessonSearch){
    lessonSearch.addEventListener('input', ()=>{
      renderMain();
      setTimeout(()=>{ const el=document.getElementById('lessonSearch'); if(el){ el.focus(); el.selectionStart = el.selectionEnd = el.value.length; } },0);
    });
  }
}

/* ===================== INIT ===================== */
document.querySelectorAll('.nav-item').forEach(el=>{
  el.addEventListener('click', ()=> setTab(el.dataset.tab));
});
document.getElementById('resetBtn').addEventListener('click', resetData);

loadData();
</script>
</body>
</html>
